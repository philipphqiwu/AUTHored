global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'auth-server'
    static_configs:
      - targets: ['auth-server:3000']
    metrics_path: '/metrics'

  - job_name: 'control-panel'
    static_configs:
      - targets: ['control-panel:3001']
    metrics_path: '/metrics'

  - job_name: 'app-a'
    static_configs:
      - targets: ['app-a:3002']
    metrics_path: '/metrics'

  - job_name: 'app-b'
    static_configs:
      - targets: ['app-b:3003']
    metrics_path: '/metrics'

  - job_name: 'sync-worker'
    static_configs:
      - targets: ['sync-worker:3004']
    metrics_path: '/metrics'
