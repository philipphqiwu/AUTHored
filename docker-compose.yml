services:
  postgres:
    image: postgres:16-alpine
    container_name: authored-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: auth_db,app_a_db,app_b_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - authored-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: authored-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - authored-network

  auth-server:
    build:
      context: ./auth-provider/server
      dockerfile: ../../Dockerfile
    container_name: authored-auth-server
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/auth_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      APP_A_LOGOUT_URL: http://app-a:3002/internal/logout
      APP_B_LOGOUT_URL: http://app-b:3003/internal/logout
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - authored-network
    command: sh -c "npx prisma generate && npx prisma db push && npm run db:seed && exec ./node_modules/.bin/tsx src/index.ts"

  control-panel:
    build:
      context: ./auth-provider/control-panel
      dockerfile: ../../Dockerfile
    container_name: authored-control-panel
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/auth_db
      ADMIN_EMAIL: admin@authored.local
      ADMIN_PASSWORD: admin123
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - authored-network
    command: sh -c "npx prisma generate && exec ./node_modules/.bin/tsx src/index.ts"

  app-a:
    build:
      context: ./applications/app-a
      dockerfile: ../../Dockerfile
    container_name: authored-app-a
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app_a_db
      AUTH_PROVIDER_URL: http://localhost:3000
      INTERNAL_AUTH_PROVIDER_URL: http://auth-server:3000
      CLIENT_ID: app-a-client-id
      CLIENT_SECRET: app-a-client-secret
      REDIRECT_URI: http://localhost:3002/callback
      SESSION_SECRET: app-a-session-secret-change-in-production
      INTERNAL_SECRET: shared-secret-change-in-production
      NODE_ENV: development
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      auth-server:
        condition: service_started
    networks:
      - authored-network
    command: sh -c "npx prisma generate && npx prisma db push && exec ./node_modules/.bin/tsx src/index.ts"

  app-b:
    build:
      context: ./applications/app-b
      dockerfile: ../../Dockerfile
    container_name: authored-app-b
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app_b_db
      AUTH_PROVIDER_URL: http://localhost:3000
      INTERNAL_AUTH_PROVIDER_URL: http://auth-server:3000
      CLIENT_ID: app-b-client-id
      CLIENT_SECRET: app-b-client-secret
      REDIRECT_URI: http://localhost:3003/callback
      SESSION_SECRET: app-b-session-secret-change-in-production
      INTERNAL_SECRET: shared-secret-change-in-production
      NODE_ENV: development
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      auth-server:
        condition: service_started
    networks:
      - authored-network
    command: sh -c "npx prisma generate && npx prisma db push && exec ./node_modules/.bin/tsx src/index.ts"

  sync-worker:
    build:
      context: ./auth-provider/sync-worker
      dockerfile: ../../Dockerfile
    container_name: authored-sync-worker
    ports:
      - "3004:3004"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/auth_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_HTTP_URL: http://rabbitmq:15672
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      METRICS_PORT: 3004
      INTERNAL_SECRET: shared-secret-change-in-production
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-server:
        condition: service_started
    networks:
      - authored-network
    command: sh -c "npx prisma generate && exec ./node_modules/.bin/tsx src/index.ts"

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  authored-network:
    driver: bridge
